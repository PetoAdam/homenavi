# Keeps the HA smoke test within GitHub-hosted runner capacity while exercising
# Sentinel, EMQX, three-instance PostgreSQL, and the three-replica stateless
# service paths covered by the HA checks and runtime smoke tests.
services:
  frontend:
    enabled: false
  api-gateway:
    enabled: true
    dependsOn:
      - host: auth-service
        port: 8000
      - host: user-service
        port: 8001
  auth-service:
    enabled: true
    dependsOn:
      - host: user-service
        port: 8001
      - host: redis
        port: 6379
  user-service:
    enabled: true
  dashboard-service:
    enabled: false
  email-service:
    enabled: false
  profile-picture-service:
    enabled: false
  minio:
    enabled: false
  echo-service:
    enabled: false
  zigbee-adapter:
    enabled: false
  mock-adapter:
    enabled: true
  thread-adapter:
    enabled: false
  zigbee2mqtt:
    enabled: false
  weather-service:
    enabled: false
  device-hub:
    replicas: 3
    env:
      DEVICE_HUB_MQTT_SHARED_GROUP: device-hub-ingest
  entity-registry-service:
    replicas: 3
    env:
      ENTITY_REGISTRY_MQTT_SHARED_GROUP: entity-registry-autoimport
  history-service:
    replicas: 3
    env:
      HISTORY_SERVICE_MQTT_SHARED_GROUP: history-ingest
  automation-service:
    replicas: 3
    env:
      AUTOMATION_SERVICE_MQTT_SHARED_GROUP: automation-events
  integration-proxy:
    replicas: 1
  jaeger:
    enabled: false

mqtt:
  brokerKind: emqx

redis:
  mode: sentinel
