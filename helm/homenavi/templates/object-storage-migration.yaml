{{- if .Values.objectStorageMigration.enabled }}
{{- if ne (include "homenavi.objectStorageProvider" .) "seaweedfs" }}
{{- fail "objectStorageMigration requires dependencies.objectStorage.provider=seaweedfs" }}
{{- end }}
{{- $legacyPVC := required "objectStorageMigration.legacyMinioPVC is required when migration is enabled" .Values.objectStorageMigration.legacyMinioPVC }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homenavi.fullname" . }}-legacy-minio-source
  labels:
    {{- include "homenavi.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "homenavi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: legacy-minio-source
  template:
    metadata:
      labels:
        {{- include "homenavi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: legacy-minio-source
    spec:
      containers:
        - name: legacy-minio-source
          image: {{ .Values.objectStorageMigration.minioImage }}
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - name: s3
              containerPort: 9000
          env:
            - name: MINIO_ROOT_USER
              {{- if ne (trim (include "homenavi.storageS3AuthSecretName" .)) "" }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "homenavi.storageS3AuthSecretName" . }}
                  key: {{ include "homenavi.storageS3AccessKeyKey" . }}
              {{- else }}
              value: {{ include "homenavi.storageS3AccessKey" . | quote }}
              {{- end }}
            - name: MINIO_ROOT_PASSWORD
              {{- if ne (trim (include "homenavi.storageS3AuthSecretName" .)) "" }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "homenavi.storageS3AuthSecretName" . }}
                  key: {{ include "homenavi.storageS3SecretKeyKey" . }}
              {{- else }}
              value: {{ include "homenavi.storageS3SecretKey" . | quote }}
              {{- end }}
          volumeMounts:
            - name: legacy-minio-data
              mountPath: /data
      volumes:
        - name: legacy-minio-data
          persistentVolumeClaim:
            claimName: {{ $legacyPVC }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "homenavi.fullname" . }}-legacy-minio-source
  labels:
    {{- include "homenavi.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "homenavi.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: legacy-minio-source
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "homenavi.fullname" . }}-copy-minio-data
  labels:
    {{- include "homenavi.labels" . | nindent 4 }}
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: copy-minio-data
          image: {{ .Values.objectStorageMigration.rcloneImage }}
          command:
            - /bin/sh
            - -ec
            - |
              cat > /tmp/rclone.conf <<EOF
              [legacy]
              type = s3
              provider = Minio
              access_key_id = $STORAGE_S3_ACCESS_KEY
              secret_access_key = $STORAGE_S3_SECRET_KEY
              endpoint = http://{{ include "homenavi.fullname" . }}-legacy-minio-source:9000
              force_path_style = true
              [seaweedfs]
              type = s3
              provider = Other
              access_key_id = $STORAGE_S3_ACCESS_KEY
              secret_access_key = $STORAGE_S3_SECRET_KEY
              endpoint = {{ include "homenavi.storageS3Endpoint" . }}
              force_path_style = true
              EOF
              until rclone lsd --config /tmp/rclone.conf legacy: >/dev/null 2>&1; do sleep 2; done
              until rclone lsd --config /tmp/rclone.conf seaweedfs: >/dev/null 2>&1; do sleep 2; done
              rclone copy --config /tmp/rclone.conf legacy:{{ include "homenavi.storageS3Bucket" . }} seaweedfs:{{ include "homenavi.storageS3Bucket" . }}
          env:
            - name: STORAGE_S3_ACCESS_KEY
              {{- if ne (trim (include "homenavi.storageS3AuthSecretName" .)) "" }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "homenavi.storageS3AuthSecretName" . }}
                  key: {{ include "homenavi.storageS3AccessKeyKey" . }}
              {{- else }}
              value: {{ include "homenavi.storageS3AccessKey" . | quote }}
              {{- end }}
            - name: STORAGE_S3_SECRET_KEY
              {{- if ne (trim (include "homenavi.storageS3AuthSecretName" .)) "" }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "homenavi.storageS3AuthSecretName" . }}
                  key: {{ include "homenavi.storageS3SecretKeyKey" . }}
              {{- else }}
              value: {{ include "homenavi.storageS3SecretKey" . | quote }}
              {{- end }}
---
{{- end }}