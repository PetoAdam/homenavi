{{- $provider := include "homenavi.mqttProvider" . }}
apiVersion: v1
kind: Service
metadata:
  name: mqtt-broker
  labels:
    {{- include "homenavi.componentLabels" (dict "root" . "component" "mqtt-broker") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "homenavi.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $provider }}
  ports:
    - name: mqtt
      protocol: TCP
      port: 1883
      targetPort: 1883
    - name: websocket
      protocol: TCP
      port: 9001
      targetPort: websocket