services:
  jwt-bootstrap:
    image: alpine:3.20
    command:
      - /bin/sh
      - -ec
      - |
        apk add --no-cache bash openssl >/dev/null
        /bin/bash /app/ensure-jwt-keys.sh --dir /keys
    volumes:
      - ./scripts/ensure-jwt-keys.sh:/app/ensure-jwt-keys.sh:ro
      - ./keys:/keys
    restart: "no"

  # NOTE: Only frontend, api-gateway and nginx expose host ports in this hardened config.
  # For local debugging you can temporarily uncomment the 'ports' blocks (marked DEV) below.
  # DO NOT commit uncommented internal service ports to main.
  frontend:
    image: ghcr.io/petoadam/homenavi-frontend:${HN_VERSION:-latest}
    pull_policy: if_not_present
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        HOMENAVI_APP_VERSION: ${HN_VERSION:-latest}
        GITHUB_SHA: ${GITHUB_SHA:-}
    ports:
      - "${FRONTEND_HOST_PORT}:${FRONTEND_CONTAINER_PORT}"
    restart: unless-stopped
    networks:
      - homenavi-network
  api-gateway:
    image: ghcr.io/petoadam/homenavi-api-gateway:${HN_VERSION:-latest}
    pull_policy: if_not_present
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    ports:
      - "${API_GATEWAY_HOST_PORT}:${API_GATEWAY_PORT}"
    restart: unless-stopped
    environment:
      - AUTH_SERVICE_URL=http://auth-service:${AUTH_SERVICE_PORT}
      - USER_SERVICE_URL=http://user-service:${USER_SERVICE_PORT}
      - MQTT_WEBSOCKET_UPSTREAM_URL=${MQTT_WEBSOCKET_UPSTREAM_URL:-ws://mqtt-broker:9001}
      - JWT_PUBLIC_KEY_PATH=/app/keys/jwt_public.pem
      - REDIS_MODE=standalone
      - REDIS_ADDR=redis:${REDIS_PORT}
      - REDIS_MASTER_NAME=${REDIS_MASTER_NAME:-}
      - REDIS_SENTINEL_ADDRS=${REDIS_SENTINEL_ADDRS:-}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      jwt-bootstrap:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
      mcp-service:
        condition: service_started
      user-service:
        condition: service_started
      dashboard-service:
        condition: service_started
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - homenavi-network

  # Public URI metadata is derived by the gateway; OAuth clients remain explicitly trusted.
  mcp-service:
    image: ghcr.io/petoadam/homenavi-mcp-service:${HN_VERSION:-latest}
    pull_policy: if_not_present
    build:
      context: .
      dockerfile: ./mcp-service/Dockerfile
    restart: unless-stopped
    environment:
      - MCP_ENABLED=${MCP_ENABLED:-true}
      - MCP_RESOURCE_URI=${MCP_RESOURCE_URI:-}
      - MCP_AUTHORIZATION_SERVER_ISSUER=${MCP_AUTHORIZATION_SERVER_ISSUER:-}
      - JWT_PUBLIC_KEY_PATH=/app/keys/jwt_public.pem
      - AUTH_SERVICE_URL=http://auth-service:${AUTH_SERVICE_PORT}
      - API_GATEWAY_URL=http://api-gateway:${API_GATEWAY_PORT}
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-}
      - MCP_ENABLED_TOOLS=${MCP_ENABLED_TOOLS:-}
      - MCP_RATE_LIMIT_PER_MINUTE=${MCP_RATE_LIMIT_PER_MINUTE:-60}
      - REDIS_MODE=standalone
      - REDIS_ADDR=redis:${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      jwt-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - homenavi-network

  auth-service:
    image: ghcr.io/petoadam/homenavi-auth-service:${HN_VERSION:-latest}
    pull_policy: if_not_present
    build:
      context: .
      dockerfile: ./auth-service/Dockerfile
    restart: unless-stopped
  # DEV: expose directly (e.g. curl localhost:8000)
  # ports:
  #   - "8000:8000"
    environment:
      - AUTH_SERVICE_PORT=${AUTH_SERVICE_PORT}
      - USER_SERVICE_URL=http://user-service:${USER_SERVICE_PORT}
      - ERS_SERVICE_URL=http://entity-registry-service:${ENTITY_REGISTRY_PORT}
      - JWT_PRIVATE_KEY_PATH=/app/keys/jwt_private.pem
      - TOTP_ENCRYPTION_KEY_PATH=/app/keys/totp_encryption.key
      - MCP_RESOURCE_URI=${MCP_RESOURCE_URI:-}
      - OAUTH_TRUSTED_CLIENTS=${OAUTH_TRUSTED_CLIENTS:-}
      - OAUTH_AUTHORIZATION_UI_URL=${OAUTH_AUTHORIZATION_UI_URL:-}
      - REDIS_MODE=standalone
      - REDIS_ADDR=redis:${REDIS_PORT}
      - REDIS_MASTER_NAME=${REDIS_MASTER_NAME:-}
      - REDIS_SENTINEL_ADDRS=${REDIS_SENTINEL_ADDRS:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - EMAIL_SERVICE_URL=http://email-service:${EMAIL_SERVICE_PORT}
      - PROFILE_PICTURE_SERVICE_URL=http://profile-picture-service:${PROFILE_PICTURE_SERVICE_PORT}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
      - GOOGLE_OAUTH_REDIRECT_URL=${GOOGLE_OAUTH_REDIRECT_URL}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      jwt-bootstrap:
        condition: service_completed_successfully
      user-service:
        condition: service_started
      redis:
        condition: service_healthy
      email-service:
        condition: service_started
      profile-picture-service:
        condition: service_started
    networks:
      - homenavi-network

  redis:
    image: valkey/valkey:8.0-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
  # DEV:
  # ports:
  #   - "6379:6379"
    networks:
      - homenavi-network

  prometheus:
    image: prom/prometheus:v3.9.1
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - homenavi-network
    ports:
      - "${PROMETHEUS_HOST_PORT}:${PROMETHEUS_PORT}"

  grafana:
    image: grafana/grafana:12.3.2
    restart: unless-stopped
    networks:
      - homenavi-network
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_HOST_PORT}:${GRAFANA_PORT}"

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    restart: unless-stopped
    networks:
      - homenavi-network
    ports:
      - "${JAEGER_UI_HOST_PORT}:${JAEGER_UI_PORT}"
      - "${JAEGER_COLLECTOR_HOST_PORT}:${JAEGER_COLLECTOR_PORT}"

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "${NGINX_HOST_PORT}:${NGINX_PORT}"
    volumes:
      - ./nginx/nginx.conf.dev.template:/etc/nginx/nginx.conf.dev.template:ro
      - ./nginx/nginx.conf.prod.template:/etc/nginx/nginx.conf.prod.template:ro
      - ./helm/homenavi/files/edge-routes-common.conf:/etc/nginx/routes-common.conf:ro
      - ./nginx/routes.conf.dev:/etc/nginx/routes.conf:ro
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - ${NGINX_CERT_ORIGIN}:/etc/nginx/certs/nginx.crt:ro
      - ${NGINX_KEY_ORIGIN}:/etc/nginx/certs/nginx.key:ro
    environment:
      - NGINX_MODE=${NGINX_MODE}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - api-gateway
      - frontend
    restart: unless-stopped
    networks:
      - homenavi-network

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - homenavi-network
  # DEV:
  # ports:
  #   - "5432:5432"

  user-service:
    image: ghcr.io/petoadam/homenavi-user-service:${HN_VERSION:-latest}
    pull_policy: if_not_present
    build:
      context: .
      dockerfile: ./user-service/Dockerfile
    restart: unless-stopped
  # DEV:
  # ports:
  #   - "8001:8001"
    environment:
      - USER_SERVICE_PORT=${USER_SERVICE_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE:-disable}
      - JWT_PUBLIC_KEY_PATH=/app/keys/jwt_public.pem
      - REDIS_MODE=standalone
      - REDIS_ADDR=redis:${REDIS_PORT}
      - REDIS_MASTER_NAME=${REDIS_MASTER_NAME:-}
      - REDIS_SENTINEL_ADDRS=${REDIS_SENTINEL_ADDRS:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
    depends_on:
      jwt-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - homenavi-network
    volumes:
      - ./keys:/app/keys:ro

  dashboard-service:
    image: ghcr.io/petoadam/homenavi-dashboard-service:${HN_VERSION:-latest}
    pull_policy: if_not_present
    build:
      context: .
      dockerfile: ./dashboard-service/Dockerfile
    restart: unless-stopped
    environment:
      - DASHBOARD_SERVICE_PORT=${DASHBOARD_SERVICE_PORT:-8097}
      - INTEGRATION_PROXY_URL=http://integration-proxy:8099
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE:-disable}
      - JWT_PUBLIC_KEY_PATH=/app/keys/jwt_public.pem
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
    depends_on:
      jwt-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - homenavi-network
    volumes:
      - ./keys:/app/keys:ro

  profile-picture-service:
    image: ghcr.io/petoadam/homenavi-profile-picture-service:${HN_VERSION:-latest}
    pull_policy: if_not_present
    build: ./profile-picture-service
    restart: unless-stopped
    depends_on:
      object-storage-create-bucket:
        condition: service_completed_successfully
    environment:
      - PROFILE_PICTURE_SERVICE_PORT=${PROFILE_PICTURE_SERVICE_PORT}
      - STORAGE_TYPE=${PROFILE_PICTURE_STORAGE_TYPE:-s3}
      - PROFILE_PICTURE_PUBLIC_BASE_PATH=/api/profile-pictures
      - STORAGE_S3_ENDPOINT=${PROFILE_PICTURE_STORAGE_S3_ENDPOINT:-http://seaweedfs:8333}
      - STORAGE_S3_REGION=${PROFILE_PICTURE_STORAGE_S3_REGION:-us-east-1}
      - STORAGE_S3_BUCKET=${PROFILE_PICTURE_STORAGE_S3_BUCKET:-profile-pictures}
      - STORAGE_S3_ACCESS_KEY=${PROFILE_PICTURE_STORAGE_S3_ACCESS_KEY:?set PROFILE_PICTURE_STORAGE_S3_ACCESS_KEY in .env}
      - STORAGE_S3_SECRET_KEY=${PROFILE_PICTURE_STORAGE_S3_SECRET_KEY:?set PROFILE_PICTURE_STORAGE_S3_SECRET_KEY in .env}
      - STORAGE_S3_FORCE_PATH_STYLE=${PROFILE_PICTURE_STORAGE_S3_FORCE_PATH_STYLE:-true}
      - STORAGE_PRESIGN_EXPIRY_SECONDS=${PROFILE_PICTURE_STORAGE_PRESIGN_EXPIRY_SECONDS:-900}
    networks:
      - homenavi-network
  # DEV:
  # ports:
  #   - "8086:8000"

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: mini -dir=/data
    environment:
      - AWS_ACCESS_KEY_ID=${PROFILE_PICTURE_STORAGE_S3_ACCESS_KEY:?set PROFILE_PICTURE_STORAGE_S3_ACCESS_KEY in .env}
      - AWS_SECRET_ACCESS_KEY=${PROFILE_PICTURE_STORAGE_S3_SECRET_KEY:?set PROFILE_PICTURE_STORAGE_S3_SECRET_KEY in .env}
      - S3_BUCKET=${PROFILE_PICTURE_STORAGE_S3_BUCKET:-profile-pictures}
    volumes:
      - seaweedfs_data:/data
    networks:
      - homenavi-network

  object-storage-create-bucket:
    image: amazon/aws-cli:2.17.0
    restart: "no"
    depends_on:
      - seaweedfs
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until aws --endpoint-url http://seaweedfs:8333 s3api list-buckets >/dev/null 2>&1; do
          echo "waiting for SeaweedFS..."
          sleep 2
        done
        aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket "${PROFILE_PICTURE_STORAGE_S3_BUCKET:-profile-pictures}" 2>/dev/null || \
          aws --endpoint-url http://seaweedfs:8333 s3api create-bucket --bucket "${PROFILE_PICTURE_STORAGE_S3_BUCKET:-profile-pictures}" || \
          aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket "${PROFILE_PICTURE_STORAGE_S3_BUCKET:-profile-pictures}" 2>/dev/null
    environment:
      AWS_ACCESS_KEY_ID: ${PROFILE_PICTURE_STORAGE_S3_ACCESS_KEY:?set PROFILE_PICTURE_STORAGE_S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${PROFILE_PICTURE_STORAGE_S3_SECRET_KEY:?set PROFILE_PICTURE_STORAGE_S3_SECRET_KEY in .env}
      AWS_DEFAULT_REGION: ${PROFILE_PICTURE_STORAGE_S3_REGION:-us-east-1}
    networks:
      - homenavi-network

  email-service:
    image: ghcr.io/petoadam/homenavi-email-service:${HN_VERSION:-latest}
    pull_policy: if_not_present
    build:
      context: .
      dockerfile: ./email-service/Dockerfile
    restart: unless-stopped
    environment:
      - EMAIL_SERVICE_PORT=${EMAIL_SERVICE_PORT}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@homenavi.org}
      - FROM_NAME=${FROM_NAME:-Homenavi}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
    networks:
      - homenavi-network
  # DEV:
  # ports:
  #   - "8002:8002"

  echo-service:
    image: ghcr.io/petoadam/homenavi-echo-service:${HN_VERSION:-latest}
    pull_policy: if_not_present
    build: ./echo-service
    restart: unless-stopped
    networks:
      - homenavi-network
  # DEV:
  # ports:
  #   - "9000:9000"

  mosquitto:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - |
        cat > /tmp/homenavi-mosquitto.conf <<EOF
        persistence ${MOSQUITTO_PERSISTENCE:-false}
        persistence_location /mosquitto/data/
        autosave_interval ${MOSQUITTO_AUTOSAVE_INTERVAL:-1800}
        allow_anonymous ${MOSQUITTO_ALLOW_ANONYMOUS:-true}
        log_dest ${MOSQUITTO_LOG_DESTINATION:-stdout}

        listener ${MQTT_PORT:-1883} 0.0.0.0
        protocol mqtt

        listener ${MQTT_WS_PORT:-9001} 0.0.0.0
        protocol websockets
        EOF
        if [ -n "${MOSQUITTO_EXTRA_CONFIG:-}" ]; then
          printf '\n%s\n' "$MOSQUITTO_EXTRA_CONFIG" >> /tmp/homenavi-mosquitto.conf
        fi
        exec mosquitto -c /tmp/homenavi-mosquitto.conf
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/#' -C 1 -W 5 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      homenavi-network:
        aliases:
          - mqtt-broker
    volumes:
      - mosquitto_data:/mosquitto/data
    ports:
      - "${MQTT_HOST_PORT}:${MQTT_PORT}"
      - "${MQTT_WS_HOST_PORT}:${MQTT_WS_PORT}"

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:2.8.0
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    networks:
      - homenavi-network
    environment:
      - TZ=UTC
      - ZIGBEE2MQTT_CONFIG_MQTT_SERVER
      - ZIGBEE2MQTT_CONFIG_SERIAL_PORT
      - ZIGBEE2MQTT_CONFIG_FRONTEND_ENABLED
      - ZIGBEE2MQTT_CONFIG_FRONTEND_PORT
      - ZIGBEE2MQTT_CONFIG_PERMIT_JOIN
      - ZIGBEE2MQTT_CONFIG_HOMEASSISTANT_ENABLED
      - ZIGBEE2MQTT_CONFIG_ADVANCED_LOG_LEVEL
    volumes:
      - ./zigbee2mqtt-data:/app/data
    # Configure the host-to-container device mapping through ZIGBEE2MQTT_DEVICE_MAPPING.
    # The /dev/null fallback keeps the opt-in hardware profile portable without a coordinator.
    devices:
      - ${ZIGBEE2MQTT_DEVICE_MAPPING:-/dev/null:/dev/null}
    # NOTE: Web UI disabled for minimal attack surface; can enable via configuration.yaml if needed

  device-hub:
    image: ghcr.io/petoadam/homenavi-device-hub:${HN_VERSION:-latest}
    pull_policy: if_not_present
    build:
      context: .
      dockerfile: ./device-hub/Dockerfile
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DEVICE_HUB_PORT=${DEVICE_HUB_PORT}
      - MQTT_BROKER_URL=${MQTT_BROKER_URL:-mqtt://mqtt-broker:1883}
      - MQTT_BROKER_KIND=${MQTT_BROKER_KIND:-mosquitto}
      - DEVICE_HUB_MQTT_SHARED_GROUP=${DEVICE_HUB_MQTT_SHARED_GROUP:-}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE:-disable}
      - REDIS_ADDR=${REDIS_ADDR:-redis:6379}
      - DEVICE_HUB_ENABLE_THREAD=true
      - LOG_LEVEL=${LOG_LEVEL}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
    networks:
      - homenavi-network
    # No ports exposed; internal only

  entity-registry-service:
    image: ghcr.io/petoadam/homenavi-entity-registry-service:${HN_VERSION:-latest}
    pull_policy: if_not_present
    build:
      context: .
      dockerfile: ./entity-registry-service/Dockerfile
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - ENTITY_REGISTRY_PORT=${ENTITY_REGISTRY_PORT}
      - MQTT_BROKER_URL=${MQTT_BROKER_URL:-mqtt://mqtt-broker:1883}
      - MQTT_BROKER_KIND=${MQTT_BROKER_KIND:-mosquitto}
      - ENTITY_REGISTRY_MQTT_SHARED_GROUP=${ENTITY_REGISTRY_MQTT_SHARED_GROUP:-}
      - DEVICE_HUB_URL=http://device-hub:${DEVICE_HUB_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE:-disable}
    networks:
      - homenavi-network
    # No ports exposed; internal only

  zigbee-adapter:
    image: ghcr.io/petoadam/homenavi-zigbee-adapter:${HN_VERSION:-latest}
    pull_policy: if_not_present
    build:
      context: .
      dockerfile: ./zigbee-adapter/Dockerfile
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ZIGBEE_ADAPTER_PORT=${ZIGBEE_ADAPTER_PORT}
      - ZIGBEE_ADAPTER_ID=zigbee-adapter-1
      - ZIGBEE_ADAPTER_VERSION=dev
      - MQTT_BROKER_URL=${MQTT_BROKER_URL:-mqtt://mqtt-broker:1883}
      - MQTT_BROKER_KIND=${MQTT_BROKER_KIND:-mosquitto}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE:-disable}
      - REDIS_MODE=standalone
      - REDIS_ADDR=redis:${REDIS_PORT}
      - REDIS_MASTER_NAME=${REDIS_MASTER_NAME:-}
      - REDIS_SENTINEL_ADDRS=${REDIS_SENTINEL_ADDRS:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - LOG_LEVEL=${LOG_LEVEL}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
    networks:
      - homenavi-network

  mock-adapter:
    profiles: ["mock-adapter"]
    image: ghcr.io/petoadam/homenavi-mock-adapter:${HN_VERSION:-latest}
    pull_policy: if_not_present
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      - MOCK_ADAPTER_PORT=${MOCK_ADAPTER_PORT:-8092}
      - MQTT_BROKER_URL=${MQTT_BROKER_URL:-mqtt://mqtt-broker:1883}
      - MQTT_BROKER_KIND=${MQTT_BROKER_KIND:-mosquitto}
      - MOCK_ADAPTER_ID=mock-adapter-1
      - MOCK_ADAPTER_VERSION=dev
      - LOG_LEVEL=${LOG_LEVEL}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
    networks:
      - homenavi-network

  history-service:
    image: ghcr.io/petoadam/homenavi-history-service:${HN_VERSION:-latest}
    pull_policy: if_not_present
    build:
      context: .
      dockerfile: ./history-service/Dockerfile
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - HISTORY_SERVICE_PORT=${HISTORY_SERVICE_PORT}
      - MQTT_BROKER_URL=${MQTT_BROKER_URL:-mqtt://mqtt-broker:1883}
      - MQTT_BROKER_KIND=${MQTT_BROKER_KIND:-mosquitto}
      - HISTORY_SERVICE_MQTT_CLIENT_ID=${HISTORY_SERVICE_MQTT_CLIENT_ID:-}
      - HISTORY_SERVICE_MQTT_SHARED_GROUP=${HISTORY_SERVICE_MQTT_SHARED_GROUP:-}
      - HISTORY_INGEST_RETAINED=${HISTORY_INGEST_RETAINED}
      - HISTORY_HDP_STATE_PREFIX=${HISTORY_HDP_STATE_PREFIX}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE}
      - LOG_LEVEL=${LOG_LEVEL}
    networks:
      - homenavi-network

  automation-service:
    image: ghcr.io/petoadam/homenavi-automation-service:${HN_VERSION:-latest}
    pull_policy: if_not_present
    build:
      context: .
      dockerfile: ./automation-service/Dockerfile
    restart: unless-stopped
    depends_on:
      jwt-bootstrap:
        condition: service_completed_successfully
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - AUTOMATION_SERVICE_PORT=${AUTOMATION_SERVICE_PORT}
      - MQTT_BROKER_URL=${MQTT_BROKER_URL:-mqtt://mqtt-broker:1883}
      - MQTT_BROKER_KIND=${MQTT_BROKER_KIND:-mosquitto}
      - AUTOMATION_SERVICE_MQTT_CLIENT_ID=${AUTOMATION_SERVICE_MQTT_CLIENT_ID:-}
      - AUTOMATION_SERVICE_MQTT_SHARED_GROUP=${AUTOMATION_SERVICE_MQTT_SHARED_GROUP:-}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE}
      - JWT_PUBLIC_KEY_PATH=/app/keys/jwt_public.pem
      - USER_SERVICE_URL=http://user-service:${USER_SERVICE_PORT}
      - EMAIL_SERVICE_URL=http://email-service:${EMAIL_SERVICE_PORT}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - ./keys:/app/keys:ro
    networks:
      - homenavi-network

  weather-service:
    image: ghcr.io/petoadam/homenavi-weather-service:${HN_VERSION:-latest}
    pull_policy: if_not_present
    build:
      context: .
      dockerfile: ./weather-service/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=${WEATHER_SERVICE_PORT:-8095}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
      - CACHE_TTL_MINUTES=${WEATHER_CACHE_TTL_MINUTES:-15}
      - LOG_LEVEL=${LOG_LEVEL}
    networks:
      - homenavi-network

  integration-proxy:
    image: ghcr.io/petoadam/homenavi-integration-proxy:${HN_VERSION:-latest}
    pull_policy: if_not_present
    build:
      context: .
      dockerfile: ./integration-proxy/Dockerfile
    restart: unless-stopped
    environment:
      - INTEGRATIONS_CONFIG_PATH=/config/installed.yaml
      - INTEGRATIONS_SCHEMA_PATH=/config/homenavi-integration.schema.json
      - INTEGRATIONS_COMPOSE_ENABLED=true
      - INTEGRATIONS_COMPOSE_FILE=/app/integrations/docker-compose.integrations.yml
      - INTEGRATIONS_COMPOSE_PROJECT=homenavi
      - INTEGRATIONS_COMPOSE_ENV_FILE=/app/.env
      - INTEGRATIONS_ROOT=${INTEGRATIONS_ROOT:-${PWD}}
      - JWT_PUBLIC_KEY_PATH=/app/keys/jwt_public.pem
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE:-disable}
    volumes:
      - ${INTEGRATIONS_ROOT:-${PWD}}:${INTEGRATIONS_ROOT:-${PWD}}:ro
      - ${INTEGRATIONS_ROOT:-${PWD}}/integrations/secrets:${INTEGRATIONS_ROOT:-${PWD}}/integrations/secrets:rw
      - ${INTEGRATIONS_CONFIG_FILE:-./integrations/config/installed.yaml}:/config/installed.yaml:rw
      - ./integrations/config/marketplace.yaml:/config/marketplace.yaml:ro
      - ./integrations/spec/homenavi-integration.schema.json:/config/homenavi-integration.schema.json:ro
      - ./integrations/docker-compose.integrations.yml:/app/integrations/docker-compose.integrations.yml:ro
      - ${COMPOSE_ENV_FILE:-./.env}:/app/.env:ro
      - ./keys:/app/keys:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      jwt-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - homenavi-network


volumes:
  postgres_data:
  auth_postgres_data:
  seaweedfs_data:
  mosquitto_data:

networks:
  homenavi-network:
    name: ${COMPOSE_PROJECT_NAME:-homenavi}-network
    driver: bridge
    