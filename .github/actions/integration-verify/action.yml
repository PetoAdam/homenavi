name: 'Homenavi Integration Verify'
description: 'Validates a Homenavi integration repository for structure + manifest compatibility.'
inputs:
  manifest_path:
    description: 'Path to homenavi-integration.json'
    required: false
    default: 'manifest/homenavi-integration.json'
  run_tests:
    description: 'Run standard integration tests (go test + frontend build + manifest validator)'
    required: false
    default: 'true'
  frontend_dir:
    description: 'Relative path to the integration frontend package'
    required: false
    default: 'src/frontend'
  require_hdp_metadata:
    description: 'Require tests to export HDP metadata samples for presentation validation'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Verify integration manifest + structure
      shell: bash
      run: |
        set -euo pipefail
        cd "${GITHUB_ACTION_PATH}"
        go run ./verifier \
          --repo-root "${GITHUB_WORKSPACE}" \
          --manifest "${GITHUB_WORKSPACE}/${{ inputs.manifest_path }}" \
          --schema "${GITHUB_ACTION_PATH}/homenavi-integration.schema.json"
    - name: Run integration test checklist
      if: ${{ inputs.run_tests == 'true' }}
      shell: bash
      env:
        REQUIRE_HDP_METADATA: ${{ inputs.require_hdp_metadata }}
      run: |
        set -euo pipefail
        cd "${GITHUB_WORKSPACE}"

        metadata_dir="$(mktemp -d)"

        if [ -f "go.mod" ]; then
          echo "Running go test ./..."
          HOMENAVI_HDP_METADATA_OUTPUT_DIR="$metadata_dir" go test -count=1 ./...
        fi

        cd "${GITHUB_ACTION_PATH}"
        go run ./verifier \
          --repo-root "${GITHUB_WORKSPACE}" \
          --manifest "${GITHUB_WORKSPACE}/${{ inputs.manifest_path }}" \
          --schema "${GITHUB_ACTION_PATH}/homenavi-integration.schema.json" \
          --hdp-metadata-dir "$metadata_dir" \
          --hdp-schema "${GITHUB_ACTION_PATH}/../../../doc/hdp-ui-presentation.schema.json" \
          --require-hdp-metadata="${REQUIRE_HDP_METADATA}"
        cd "${GITHUB_WORKSPACE}"

        if [ -f "cmd/validate-manifest/main.go" ]; then
          echo "Running manifest validator"
          go run ./cmd/validate-manifest
        fi

        if [ -f "${{ inputs.frontend_dir }}/package.json" ]; then
          echo "Building frontend in ${{ inputs.frontend_dir }}"
          pushd "${{ inputs.frontend_dir }}" > /dev/null
          npm install
          npm run build
          popd > /dev/null
        fi
    - name: Require tests for HDP validation
      if: ${{ inputs.run_tests != 'true' && inputs.require_hdp_metadata == 'true' }}
      shell: bash
      run: |
        echo 'HDP metadata validation requires run_tests=true' >&2
        exit 1
