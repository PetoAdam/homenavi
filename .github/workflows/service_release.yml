name: Release Docker Image (Reusable)

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      context:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      build_args:
        required: false
        type: string
        default: ""

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute registry owner
        id: owner
        run: echo "owner_lower=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select release tags
        id: release_tags
        shell: bash
        run: |
          image="${{ env.REGISTRY }}/${{ steps.owner.outputs.owner_lower }}/homenavi-${{ inputs.service }}"
          {
            echo 'tags<<EOF'
            echo "${image}:${GITHUB_REF_NAME}"
            if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "${image}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'publish_latest=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish_latest=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build_args }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.release_tags.outputs.tags }}

      - name: Verify published release tag
        run: |
          image="${{ env.REGISTRY }}/${{ steps.owner.outputs.owner_lower }}/homenavi-${{ inputs.service }}"
          docker buildx imagetools inspect "${image}:${{ github.ref_name }}"

      - name: Verify published latest tag
        if: steps.release_tags.outputs.publish_latest == 'true'
        run: |
          image="${{ env.REGISTRY }}/${{ steps.owner.outputs.owner_lower }}/homenavi-${{ inputs.service }}"
          docker buildx imagetools inspect "${image}:latest"