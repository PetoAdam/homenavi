name: MCP OAuth Gateway Quality Gate

"on":
  pull_request:
    branches: [main]
    paths:
      - "shared/authx/**"
      - "auth-service/**"
      - "mcp-service/**"
      - "api-gateway/**"
      - ".github/workflows/mcp_oauth_gateway_quality_gate.yaml"
  push:
    branches: [main]
    paths:
      - "shared/authx/**"
      - "auth-service/**"
      - "mcp-service/**"
      - "api-gateway/**"
      - ".github/workflows/mcp_oauth_gateway_quality_gate.yaml"

jobs:
  test:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    services:
      redis:
        image: ${{ matrix.module == 'auth-service' && 'redis:7-alpine' || '' }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      HOMENAVI_TEST_REDIS_ADDR: ${{ matrix.module == 'auth-service' && '127.0.0.1:6379' || '' }}
    strategy:
      fail-fast: false
      matrix:
        module: [shared, auth-service, mcp-service, api-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ./shared/go.mod
          cache: false
      - name: Download modules
        working-directory: ./${{ matrix.module }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Module download failed; retrying (${attempt}/3)"
            sleep "$attempt"
          done
      - name: Static analysis
        working-directory: ./${{ matrix.module }}
        run: go vet ./...
      - name: Unit and component tests
        working-directory: ./${{ matrix.module }}
        run: go test -count=1 ./...