name: Release Voice Service Images

"on":
  push:
    tags: ["voice-v*"]

permissions:
  contents: write
  packages: write

jobs:
  gateway:
    uses: ./.github/workflows/service_release.yml
    with:
      service: voice-gateway
      context: .
      dockerfile: ./voice-gateway/Dockerfile
    secrets: inherit
  stt:
    uses: ./.github/workflows/service_release.yml
    with:
      service: voice-stt
      context: ./voice-poc/faster-whisper
      dockerfile: ./voice-poc/faster-whisper/Dockerfile
    secrets: inherit
  tts:
    uses: ./.github/workflows/service_release.yml
    with:
      service: voice-tts
      context: ./voice-poc/piper
      dockerfile: ./voice-poc/piper/Dockerfile
    secrets: inherit
  make-packages-public:
    needs: [gateway, stt, tts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            for (const packageName of [
              "homenavi-voice-gateway",
              "homenavi-voice-stt",
              "homenavi-voice-tts",
            ]) {
              await github.rest.packages.updatePackageForUser({
                package_type: "container",
                package_name: packageName,
                username: context.repo.owner,
                visibility: "public",
              });
            }