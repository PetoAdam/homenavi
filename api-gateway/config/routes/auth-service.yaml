routes:
  - path: /.well-known/oauth-authorization-server
    upstream: http://auth-service:8000/.well-known/oauth-authorization-server
    methods: [GET]
    access: public
    type: rest
  - path: /.well-known/oauth-authorization-server/api/auth
    upstream: http://auth-service:8000/.well-known/oauth-authorization-server/api/auth
    methods: [GET]
    access: public
    type: rest
  - path: /api/auth/health
    upstream: http://auth-service:8000/health
    methods: [GET]
    access: auth
    type: rest
  - path: /api/auth/signup
    upstream: http://auth-service:8000/api/auth/signup
    methods: [POST]
    access: public
    type: rest
  - path: /api/auth/login/start
    upstream: http://auth-service:8000/api/auth/login/start
    methods: [POST]
    access: public
    type: rest
  - path: /api/auth/login/finish
    upstream: http://auth-service:8000/api/auth/login/finish
    methods: [POST]
    access: public
    type: rest
  - path: /api/auth/password/reset/request
    upstream: http://auth-service:8000/api/auth/password/reset/request
    methods: [POST]
    access: public
    type: rest
  - path: /api/auth/password/reset/confirm
    upstream: http://auth-service:8000/api/auth/password/reset/confirm
    methods: [POST]
    access: public
    type: rest
  - path: /api/auth/email/verify/request
    upstream: http://auth-service:8000/api/auth/email/verify/request
    methods: [POST]
    access: public
    type: rest
  - path: /api/auth/email/verify/confirm
    upstream: http://auth-service:8000/api/auth/email/verify/confirm
    methods: [POST]
    access: public
    type: rest
  - path: /api/auth/2fa/setup
    upstream: http://auth-service:8000/api/auth/2fa/setup
    methods: [POST]
    access: auth
    type: rest
  - path: /api/auth/2fa/verify
    upstream: http://auth-service:8000/api/auth/2fa/verify
    methods: [POST]
    access: auth
    type: rest
  - path: /api/auth/2fa/email/request
    upstream: http://auth-service:8000/api/auth/2fa/email/request
    methods: [POST]
    access: auth
    type: rest
  - path: /api/auth/2fa/email/verify
    upstream: http://auth-service:8000/api/auth/2fa/email/verify
    methods: [POST]
    access: auth
    type: rest
  - path: /api/auth/delete
    upstream: http://auth-service:8000/api/auth/delete
    methods: [POST]
    access: auth
    type: rest
  - path: /api/auth/refresh
    upstream: http://auth-service:8000/api/auth/refresh
    methods: [POST]
    access: public
    type: rest
  - path: /api/auth/logout
    upstream: http://auth-service:8000/api/auth/logout
    methods: [POST]
    access: auth
    type: rest
  - path: /api/auth/oauth/google/login
    upstream: http://auth-service:8000/api/auth/oauth/google/login
    methods: [GET]
    access: public
    type: rest
  - path: /api/auth/oauth/google/callback
    upstream: http://auth-service:8000/api/auth/oauth/google/callback
    methods: [GET]
    access: public
    type: rest
  - path: /api/auth/oauth/jwks.json
    upstream: http://auth-service:8000/api/auth/oauth/jwks.json
    methods: [GET]
    access: public
    type: rest
  - path: /api/auth/oauth/authorize
    upstream: http://auth-service:8000/api/auth/oauth/authorize
    methods: [GET, POST]
    access: public
    type: rest
  - path: /api/auth/oauth/token
    upstream: http://auth-service:8000/api/auth/oauth/token
    methods: [POST]
    access: public
    type: rest
  - path: /api/auth/oauth/register
    upstream: http://auth-service:8000/api/auth/oauth/register
    methods: [POST]
    access: public
    type: rest
  - path: /api/auth/oauth/transaction
    upstream: http://auth-service:8000/api/auth/oauth/transaction
    methods: [GET]
    access: public
    type: rest
  - path: /api/auth/oauth/transaction/login
    upstream: http://auth-service:8000/api/auth/oauth/transaction/login
    methods: [POST]
    access: public
    type: rest
  - path: /api/auth/oauth/transaction/verify
    upstream: http://auth-service:8000/api/auth/oauth/transaction/verify
    methods: [POST]
    access: public
    type: rest
  - path: /api/auth/oauth/transaction/approve
    upstream: http://auth-service:8000/api/auth/oauth/transaction/approve
    methods: [POST]
    access: public
    type: rest
  - path: /api/auth/oauth/transaction/deny
    upstream: http://auth-service:8000/api/auth/oauth/transaction/deny
    methods: [POST]
    access: public
    type: rest
  - path: /api/auth/oauth/consents
    upstream: http://auth-service:8000/api/auth/oauth/consents
    methods: [POST]
    access: auth
    type: rest
  - path: /api/auth/oauth/consents/{clientID}
    upstream: http://auth-service:8000/api/auth/oauth/consents/{clientID}
    methods: [DELETE]
    access: auth
    type: rest
  - path: /api/auth/oauth/google
    upstream: http://auth-service:8000/api/auth/oauth/google
    methods: [POST]
    access: public
    type: rest
  - path: /api/auth/me
    upstream: http://auth-service:8000/api/auth/me
    methods: [GET]
    access: auth
    type: rest
  - path: /api/auth/password/change
    upstream: http://auth-service:8000/api/auth/password/change
    methods: [POST]
    access: auth
    type: rest
  - path: /api/auth/profile/generate-avatar
    upstream: http://auth-service:8000/api/auth/profile/generate-avatar
    methods: [POST]
    access: auth
    type: rest
  - path: /api/auth/profile/upload-url
    upstream: http://auth-service:8000/api/auth/profile/upload-url
    methods: [POST]
    access: auth
    type: rest
  - path: /api/auth/profile/upload-complete
    upstream: http://auth-service:8000/api/auth/profile/upload-complete
    methods: [POST]
    access: auth
    type: rest
  - path: /api/auth/profile/upload
    upstream: http://auth-service:8000/api/auth/profile/upload
    methods: [POST]
    access: auth
    type: rest
  - path: /api/profile-pictures/users/{user_id}/access-url
    upstream: http://profile-picture-service:8000/profile-pictures/users/{user_id}/access-url
    methods: [GET]
    access: public
    type: rest
  - path: /api/profile-pictures/users/{user_id}
    upstream: http://profile-picture-service:8000/profile-pictures/users/{user_id}
    methods: [GET]
    access: public
    type: rest
  # User management routes (auth-service consolidated)
  - path: /api/auth/users
    upstream: http://auth-service:8000/api/auth/users
    methods: [GET]
    access: resident
    type: rest
  - path: /api/auth/users/{id}
    upstream: http://auth-service:8000/api/auth/users/{id}
    methods: [GET, PATCH]
    access: auth
    type: rest
  - path: /api/auth/users/{id}/lockout
    upstream: http://auth-service:8000/api/auth/users/{id}/lockout
    methods: [POST]
    access: admin
    type: rest
