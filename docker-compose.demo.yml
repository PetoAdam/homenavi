services:
  frontend:
    environment:
      - VITE_DEMO_MODE=true

  api-gateway:
    environment:
      - DEMO_SESSION_ACTIVITY_DEBOUNCE=60s
      - DEMO_SESSION_ACTIVITY_TTL=15m

  auth-service:
    environment:
      - DEMO_MODE=true
      - DEMO_CLEANUP_INTERVAL=1m
      - DEMO_SESSION_ACTIVITY_TTL=15m
      - DEMO_USER_HARD_CAP=1500

  dashboard-service:
    environment:
      - DEMO_MODE=true

  entity-registry-service:
    environment:
      - DEMO_MODE=true

  automation-service:
    environment:
      - DEMO_MODE=true

  integration-proxy:
    environment:
      - INTEGRATIONS_RUNTIME_MODE=gitops
      - INTEGRATIONS_CONFIG_PATH=/config/installed.demo.yaml
    volumes:
      - ./integrations/config/installed.demo.yaml:/config/installed.demo.yaml:ro

  spotify:
    build:
      context: ../homenavi-spotify
      dockerfile: ./Dockerfile
    image: homenavi-spotify:demo
    restart: unless-stopped
    environment:
      - PORT=8099
      - JWT_PUBLIC_KEY_PATH=/app/keys/jwt_public.pem
      - INTEGRATION_SETUP_PATH=/app/config/integration.setup.json
      - DEMO_MODE=true
    volumes:
      - ./integrations/setup/spotify.setup.json:/app/config/integration.setup.json
      - ./keys/jwt_public.pem:/app/keys/jwt_public.pem:ro
    networks:
      - homenavi-network

  mock-adapter:
    build:
      context: .
      dockerfile: ./mock-adapter/Dockerfile