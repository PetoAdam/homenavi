services:
  voice-gateway:
    build:
      context: ..
      dockerfile: voice-gateway/Dockerfile
    environment:
      STT_URL: http://faster-whisper:8000/v1/audio/transcriptions
      TTS_URL: ${TTS_URL:-http://piper:8000/tts}
      OPEN_WEBUI_CHAT_URL: ${OPEN_WEBUI_CHAT_URL:?set Open WebUI's OpenAI-compatible chat-completions endpoint}
      OPEN_WEBUI_API_KEY: ${OPEN_WEBUI_API_KEY:-}
      OPEN_WEBUI_MODEL: ${OPEN_WEBUI_MODEL:-orion}
      OPEN_WEBUI_TOOL_IDS: ${OPEN_WEBUI_TOOL_IDS:-server:mcp:homenavi-mcp}
      VOICE_GATEWAY_LOG_CONTENT: ${VOICE_GATEWAY_LOG_CONTENT:-false}
    ports:
      - "${VOICE_GATEWAY_PORT:-8090}:8090"
    depends_on:
      faster-whisper:
        condition: service_healthy
      piper:
        condition: service_healthy

  faster-whisper:
    build: ./faster-whisper
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-base.en}
    volumes:
      - whisper-models:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 12

  piper:
    build: ./piper
    volumes:
      - piper-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  whisper-models:
  piper-models: